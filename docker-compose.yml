services:
  db:
    image: postgres:16-alpine
    container_name: workflowx-db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports: 不需要对外暴露，内部网络即可
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflowx"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflowx-app
    restart: unless-stopped
    env_file:
      - .env.docker
    # ports: 去掉！只让 nginx 访问
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
    # 让 uvicorn 信任 nginx 传来的 X-Forwarded-* 头
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips='*'

  nginx:
    image: nginx:alpine
    container_name: workflowx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data: