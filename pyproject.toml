[project]
name = "workflowx"
version = "0.1.0"
description = "FastAPI 项目管理系统"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "python-multipart>=0.0.32",

    # 数据库
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31",
    "alembic>=1.19",

    # 配置与校验
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",

    # 日志
    "python-json-logger>=4.2",

    # 安全
    "passlib>=1.7",
    "bcrypt>=4.0,<4.1",
    "pyjwt>=2.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]